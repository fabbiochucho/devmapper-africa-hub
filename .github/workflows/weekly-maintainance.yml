# .github/workflows/weekly-maintenance.yml
# ✅ FINAL FIXED VERSION - All steps non-blocking where appropriate

name: 🔍 Weekly Dependency & Security Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  maintenance:
    name: Check Dependencies & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund --legacy-peer-deps || \
            (echo "::warning::Lockfile out of sync — falling back to npm install" && \
             npm install --no-audit --no-fund --legacy-peer-deps)
          else
            echo "::warning::package-lock.json missing — using npm install"
            npm install --no-audit --no-fund --legacy-peer-deps
          fi
        env:
          npm_config_legacy_peer_deps: true

      # ✅ FIXED: Browserslist update with graceful fallback
      - name: Update browserslist database
        run: |
          echo "🌐 Updating browserslist database..."
          npx update-browserslist-db@latest 2>/dev/null || \
          echo "::warning::Browserslist update skipped (bun not available) — run locally if needed"
        continue-on-error: true

      - name: Check for outdated packages
        id: outdated
        run: |
          npm outdated --json > outdated.json 2>/dev/null || echo '{}' > outdated.json
          if [ "$(cat outdated.json 2>/dev/null)" != "{}" ]; then
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            echo "📦 Outdated packages detected"
          else
            echo "has_outdated=false" >> $GITHUB_OUTPUT
            echo "✅ All dependencies up to date"
          fi

      - name: Run security audit
        id: audit
        run: |
          npm audit --production --audit-level=high --json > audit.json 2>/dev/null || echo '{}' > audit.json
          if [ -s audit.json ] && grep -q '"vulnerabilities"' audit.json; then
            echo "has_vulns=true" >> $GITHUB_OUTPUT
            echo "🔒 Security vulnerabilities detected"
          else
            echo "has_vulns=false" >> $GITHUB_OUTPUT
            echo "✅ No high-severity vulnerabilities found"
          fi

      - name: Create Maintenance Issue (if needed)
        if: steps.outdated.outputs.has_outdated == 'true' || steps.audit.outputs.has_vulns == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "📅 Weekly Maintenance: Updates Available",
              body: "Automated check found outdated packages or security issues. Run `npm outdated` and `npm audit` locally to review.\n\n🔗 Run: " + process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID,
              labels: ["maintenance", "dependencies"]
            });

      - name: Summary
        run: echo "✅ Weekly maintenance check complete"
