name: Claude Code Action

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
